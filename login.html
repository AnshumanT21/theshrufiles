<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shru Files 🍓</title>
<link rel="icon" type="image/png" href="assets/matchaicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Quicksand', system-ui, sans-serif;
    background: #FFF6EC;
    background-image:
      linear-gradient(rgba(226,72,61,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(226,72,61,0.08) 1px, transparent 1px);
    background-size: 26px 26px;
    position: relative;
    overflow: hidden;
  }
  .tape{
    position: absolute;
    width: 100px; height: 34px;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.6), rgba(255,255,255,0.6) 4px, rgba(242,193,78,0.55) 4px, rgba(242,193,78,0.55) 8px);
    opacity: 0.9;
  }
  .tape-l{ top: 6%; left: 8%; transform: rotate(-16deg); }
  .tape-r{ top: 8%; right: 8%; transform: rotate(14deg); background: repeating-linear-gradient(45deg, rgba(255,255,255,0.6), rgba(255,255,255,0.6) 4px, rgba(143,174,110,0.45) 4px, rgba(143,174,110,0.45) 8px); }
  .butterfly{
    position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
    font-size: 32px; animation: bob 3.6s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{ transform: translateX(-50%) translateY(0) rotate(-6deg);} 50%{ transform: translateX(-50%) translateY(-10px) rotate(6deg);} }

  .card{
    position: relative;
    z-index: 2;
    background: white;
    max-width: 380px;
    width: 100%;
    padding: 40px 32px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 24px 50px rgba(58,42,34,0.25);
    border: 2px solid #E2483D;
  }
  .lock{ font-size: 40px; margin: 0 0 6px; }
  .eyebrow{
    font-family: 'Fredoka', system-ui, sans-serif;
    letter-spacing: 2px; text-transform: uppercase; font-size: 11px;
    color: #B5342C; font-weight: 600; margin: 0 0 8px;
  }
  .title{
    font-family: 'Bungee', system-ui, sans-serif;
    font-size: 30px; color: #E2483D;
    -webkit-text-stroke: 2px #B5342C; letter-spacing: 1px; margin: 0 0 6px;
  }
  .sub{
    font-family: 'Caveat', cursive;
    font-size: 20px; color: #6B4423; margin: 0 0 26px;
  }
  form{ display: flex; flex-direction: column; gap: 12px; }
  input{
    font-family: 'Quicksand', system-ui, sans-serif;
    font-size: 15px; padding: 12px 16px; border-radius: 999px;
    border: 2px solid rgba(58,42,34,0.2); outline: none; text-align: center;
    transition: border-color 0.2s ease;
  }
  input:focus{ border-color: #E2483D; }
  button{
    font-family: 'Fredoka', system-ui, sans-serif;
    font-weight: 600; font-size: 15px; background: #E2483D; color: white;
    border: none; padding: 12px 20px; border-radius: 999px;
    box-shadow: 3px 3px 0 #B5342C; cursor: pointer; transition: transform 0.15s ease;
  }
  button:hover{ transform: translate(-2px,-2px); }
  button:active{ transform: scale(0.96); }
  .error{
    font-family: 'Caveat', cursive;
    font-size: 16px; color: #B5342C; min-height: 20px; margin: 14px 0 0;
  }
</style>
</head>
<body>
  <div class="tape tape-l" aria-hidden="true"></div>
  <div class="tape tape-r" aria-hidden="true"></div>
  <div class="butterfly" aria-hidden="true">🦋</div>

  <div class="card">
    <p class="lock">🔒</p>
    <p class="eyebrow">private · for her eyes only</p>
    <h1 class="title">the shru files</h1>
    <p class="sub">this one's just for you 🍓</p>

    <form method="POST" action="/api/login" autocomplete="off">
      <input type="password" name="password" placeholder="enter the password" autocomplete="new-password" required>
      <button type="submit">unlock ✨</button>
    </form>
    <p class="error" id="error-msg"></p>
  </div>

  <script>
    // shows a friendly message if redirected back here with ?error=1
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('error-msg').textContent = "hmm, that's not it — try again 🍓";
    }
  </script>
</body>
</html>
